x-app: &app
  image: vectorizing:local

services:
  moto:
    image: ghcr.io/getmoto/motoserver@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    environment:
      MOTO_PORT: 5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"
      interval: 2s
      timeout: 2s
      retries: 15

  moto-init:
    <<: *app
    build: .
    environment: &local-aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: vectorizing-local
      S3_TEST_BUCKET: vectorizing-tests
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: ${PORT:-8000}
    depends_on:
      moto:
        condition: service_healthy
    command: python scripts/init_moto.py
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *local-aws
    command: sh -c "exec gunicorn -w 4 'vectorizing:create_app()' --timeout 0 -b 0.0.0.0:$$PORT --log-level debug"
    depends_on:
      moto-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"

  test:
    <<: *app
    profiles: [testing]
    environment:
      <<: *local-aws
    volumes:
      - ./vectorizing/tests/results:/app/vectorizing/tests/results
      - ./vectorizing/tests/diff_output:/app/vectorizing/tests/diff_output
    depends_on:
      moto-init:
        condition: service_completed_successfully
    command: python -m pytest vectorizing/tests/test.py
